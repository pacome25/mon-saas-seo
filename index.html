<!DOCTYPE html>
<html>
<head>
    <title>Mon SaaS SEO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 3rem; }
        .badge {
            background: #22c55e;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.9rem;
        }
        .status {
            margin-top: 30px;
            font-size: 1.2rem;
        }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 SEO Autopilot</h1>
        <div class="badge">✅ En ligne</div>
        <p style="font-size:1.2rem; margin:20px 0;">Votre SaaS est prêt à générer des articles SEO avec Claude</p>
        <div class="status">
            <span class="dot"></span> Connecté à GitHub + Netlify
        </div>
        <p style="margin-top:40px; opacity:0.7; font-size:0.9rem;">
            Prochaine étape : Connecter Netlify
        </p>
    </div>
</body>
</html>
