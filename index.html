<!DOCTYPE html>
<html>
<head>
    <title>SEO Autopilot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 3rem; }
        .badge {
            background: #22c55e;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.9rem;
        }
        .connect-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .connect-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 SEO Autopilot</h1>
        <div class="badge">✅ En ligne</div>
        <p style="font-size:1.2rem; margin:20px 0;">Votre SaaS est prêt à générer des articles SEO avec Claude</p>
        <a href="/connect.html" class="connect-btn">🔌 Connecter un site</a>
    </div>
</body>
</html>
