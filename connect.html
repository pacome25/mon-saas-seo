<!DOCTYPE html>
<html>
<head>
    <title>Connecter un site - SEO Autopilot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 600px; width: 100%; }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; margin: 10px 0 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover { transform: translateY(-2px); }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success { background: #dcfce7; color: #166534; display: block; }
        .error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔌 Connecter un site</h1>
            <p class="subtitle">Remplissez les informations de votre site</p>

            <form id="connectForm">
                <div class="form-group">
                    <label>Nom du site *</label>
                    <input type="text" id="siteName" placeholder="Mon Blog Tech" required>
                </div>

                <div class="form-group">
                    <label>URL du site *</label>
                    <input type="url" id="siteUrl" placeholder="https://monblog.com" required>
                </div>

                <button type="submit">🔗 Connecter</button>
            </form>

            <div id="result"></div>
        </div>
    </div>

    <script>
        document.getElementById('connectForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                siteName: document.getElementById('siteName').value,
                siteUrl: document.getElementById('siteUrl').value,
            };

            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Connexion en cours...';
            resultDiv.style.display = 'block';

            try {
                const response = await fetch('/.netlify/functions/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = `✅ ${result.message}`;
                } else {
                    throw new Error(result.error || 'Erreur');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ Erreur : ${error.message}`;
            }
        });
    </script>
</body>
</html>
