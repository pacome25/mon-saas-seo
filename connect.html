<!DOCTYPE html>
<html>
<head>
    <title>Connecter un site - SEO Autopilot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 700px; width: 100%; }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; margin: 10px 0 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        #articleResult {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        #articleResult.visible { display: block; }
        .success { background: #dcfce7; color: #166534; display: block; }
        .error { background: #fee2e2; color: #991b1b; display: block; }
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loader.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .section-title {
            font-weight: bold;
            margin: 20px 0 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🚀 SEO Autopilot</h1>
            <p class="subtitle">Connectez un site et générez des articles</p>

            <!-- Formulaire de connexion -->
            <form id="connectForm">
                <div class="form-group">
                    <label>Nom du site *</label>
                    <input type="text" id="siteName" placeholder="Mon Blog Tech" required>
                </div>

                <div class="form-group">
                    <label>URL du site *</label>
                    <input type="url" id="siteUrl" placeholder="https://monblog.com" required>
                </div>

                <div class="form-group">
                    <label>Mot-clé pour l'article *</label>
                    <input type="text" id="keyword" placeholder="intelligence artificielle" required>
                </div>

                <button type="submit" id="connectBtn">🔗 Connecter le site</button>
            </form>

            <div id="result"></div>

            <!-- Bouton Générer -->
            <button id="generateBtn" style="margin-top: 15px; background: linear-gradient(135deg, #22c55e, #16a34a);">📝 Générer un article</button>

            <!-- Loader -->
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="color: #666; margin-top: 10px;">Génération en cours... (30-60 secondes)</p>
            </div>

            <!-- Résultat de l'article -->
            <div id="articleResult"></div>
        </div>
    </div>

    <script>
        // -------- CONNEXION ----------
        document.getElementById('connectForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                siteName: document.getElementById('siteName').value,
                siteUrl: document.getElementById('siteUrl').value,
            };

            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Connexion en cours...';
            resultDiv.style.display = 'block';

            try {
                const response = await fetch('/.netlify/functions/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = `✅ ${result.message}`;
                } else {
                    throw new Error(result.error || 'Erreur');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ Erreur : ${error.message}`;
            }
        });

        // -------- GÉNÉRATION ----------
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const keyword = document.getElementById('keyword').value.trim();
            if (!keyword) {
                alert('Veuillez entrer un mot-clé.');
                return;
            }

            const btn = this;
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('articleResult');

            btn.disabled = true;
            loader.classList.add('active');
            resultDiv.className = '';
            resultDiv.textContent = '';

            try {
                const response = await fetch('/.netlify/functions/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword }),
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.textContent = data.content;
                    resultDiv.className = 'visible';
                } else {
                    resultDiv.textContent = '❌ Erreur : ' + (data.error || 'Problème');
                    resultDiv.className = 'visible';
                }
            } catch (error) {
                resultDiv.textContent = '❌ Erreur réseau : ' + error.message;
                resultDiv.className = 'visible';
            } finally {
                btn.disabled = false;
                loader.classList.remove('active');
            }
        });
    </script>
</body>
</html>
